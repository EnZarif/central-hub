<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" role="img" aria-label="Central Hub">
  <!-- The home-screen icon: the same stack with room to breathe, so the
       plates can taper the way they do in the app and the top one can sit
       light. "CH" is gone - at 192 it read, but the mark says the same thing
       without asking anyone to expand an abbreviation. -->
  <rect width="192" height="192" rx="40" fill="#0a0d14"/>
  <rect x="10" y="10" width="172" height="172" rx="32" fill="#10141e"/>
  <g fill="#37c8b4" stroke="#37c8b4" stroke-width="9" stroke-linejoin="round">
    <path d="M96 118 L150 138 L96 158 L42 138 Z" fill-opacity=".2"/>
    <path d="M96 83 L146 101 L96 119 L46 101 Z" fill-opacity=".13" stroke-opacity=".62"/>
    <path d="M96 48 L142 64 L96 80 L50 64 Z" fill-opacity=".07" stroke-opacity=".36"/>
  </g>
</svg>
